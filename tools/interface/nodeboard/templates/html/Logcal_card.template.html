<div class="w3-card-4 logcal-card" data-chunk="{{ chunk-id }}" style="top:{{ vert-pos }}vh;height:{{ card-height }}vh;background-color:{{ card-color }}">
  <div class="container">
    <p class="w3-small" style="margin-top:0;"><b>{{ start-time }}</b> {{ card-text }}</p>
    <p class="w3-small">{{ minutes }} [<a href="/cgi-bin/fzlink.py?id={{ node-id }}" target="_blank">{{ node-id }}</a>]</p>
  </div>
</div>
