<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc Track</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%F0%9F%93%9A</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Doc Track</h1>
  </div>

  <nav class="tabs" role="tablist">
    <a class="tab" href="#/queue" data-view="queue">Queue <span class="tab-count" id="count-queue"></span></a>
    <a class="tab" href="#/catalog" data-view="catalog">Catalog</a>
    <a class="tab" href="#/aside" data-view="aside">Set aside <span class="tab-count tab-count-quiet" id="count-aside"></span></a>
    <a class="tab" href="#/tags" data-view="tags">Tags</a>
    <a class="tab" href="#/sent" data-view="sent">Sent</a>
  </nav>

  <div class="topbar-right">
    <span id="scan-stamp" class="stamp"></span>
    <button id="scan" class="btn" title="Re-scan ~/doc/tex and Google Drive. Reads only files that changed.">Scan</button>
    <button id="theme" class="btn btn-icon" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    <button id="stop-server" class="btn btn-icon btn-stop" title="Stop the doctrack server. Nothing is lost; the dashboard button starts it again." aria-label="Stop server">⏻</button>
  </div>
</header>

<div id="job" class="job" hidden></div>

<main id="main" class="main"></main>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
